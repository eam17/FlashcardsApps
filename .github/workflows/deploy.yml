# Builds the Blazor app and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish SpanishFlashcards/SpanishFlashcards.csproj -c Release -o release

      # The site lives at https://<user>.github.io/<repo>/, so the app's base path must be /<repo>/.
      # (Skipped for a <user>.github.io repo, which is served from the root.)
      - name: Set base path
        if: ${{ !endsWith(github.event.repository.name, '.github.io') }}
        run: sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' release/wwwroot/index.html

      # .nojekyll: let GitHub serve the _framework folder (Jekyll hides folders starting with _).
      # 404.html: a copy of the app, so unknown paths still load it.
      - name: GitHub Pages extras
        run: |
          touch release/wwwroot/.nojekyll
          cp release/wwwroot/index.html release/wwwroot/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
